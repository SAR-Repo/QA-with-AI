name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression
          - api
          - ui
          - all

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      HEADLESS: "true"
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_NAME: ${{ secrets.TEST_NAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-lock.txt
          playwright install --with-deps chromium

      - name: Run tests
        run: |
          SUITE="${{ inputs.suite }}"
          SUITE="${SUITE:-smoke}"
          if [ "$SUITE" = "all" ]; then
            pytest --alluredir=artifacts/allure-results
          else
            pytest -m "$SUITE" --alluredir=artifacts/allure-results
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: artifacts/allure-results
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: artifacts/screenshots
          retention-days: 14

      # Publish a browsable Allure report to GitHub Pages. Skipped for plain
      # PR runs so that in-progress feature-branch results never overwrite the
      # public report — only workflow_dispatch (and any future push-to-main
      # trigger) publish.
      - name: Checkout gh-pages history
        if: always() && github.event_name != 'pull_request'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report with history
        if: always() && github.event_name != 'pull_request'
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: artifacts/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Fix allure-history ownership
        # simple-elf/allure-report-action runs in a Docker container as root,
        # so it leaves allure-history/ root-owned on the runner. Later steps
        # run as the normal runner user and need to read/write it.
        if: always() && github.event_name != 'pull_request'
        run: sudo chown -R "$(id -u):$(id -g)" allure-history

      - name: Record run metadata
        if: always() && github.event_name != 'pull_request'
        run: |
          python3 scripts/record_run_metadata.py \
            --meta-in gh-pages/runs-meta.json \
            --meta-out allure-history/runs-meta.json \
            --build "${{ github.run_number }}" \
            --trigger "${{ github.event_name }}" \
            --suite "${{ inputs.suite }}"

      - name: Generate runs index page
        if: always() && github.event_name != 'pull_request'
        run: |
          python3 scripts/generate_runs_index.py \
            "allure-history/${{ github.run_number }}/history/history-trend.json" \
            allure-history/runs-meta.json \
            allure-history/runs.html

      - name: Publish report to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
