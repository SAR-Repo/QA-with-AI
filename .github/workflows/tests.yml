name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression
          - api
          - ui
          - all

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    # Safety net against a hung step (seen in practice: Install dependencies
    # stuck for 45+ minutes instead of its usual ~30s) — GitHub's own default
    # is 360 minutes, far too permissive to catch that kind of hang.
    timeout-minutes: 20
    env:
      HEADLESS: "true"
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_NAME: ${{ secrets.TEST_NAME }}
      # How many past Allure reports to keep published on gh-pages. Keeps the
      # branch (and GitHub's Pages deploy time) from growing unbounded.
      KEEP_REPORTS: "5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub-hosted ubuntu-latest (24.04/noble) runners don't point apt at a
      # literal URL — sources use the mirror+file scheme, resolving mirrors
      # from /etc/apt/apt-mirrors.txt at update time, and azure.archive.ubuntu.com
      # (one entry in that list) is flaky enough to stall apt-get for many
      # minutes before it falls back on its own. The previous attempt at this
      # fix sed'd sources.list/ubuntu.sources for a literal "azure.archive..."
      # string, but that string only lives inside apt-mirrors.txt, not in the
      # sources files themselves — so it silently did nothing. Bypass the
      # mirrorlist indirection entirely: point the URIs straight at a single
      # reliable host instead of azure.archive.ubuntu.com. The `cat` at the
      # end is a deliberate diagnostic — confirm in the next run's log that
      # the rewrite actually took effect before trusting this fix.
      - name: Work around flaky azure.archive.ubuntu.com apt mirror
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's|mirror://mirrors.ubuntu.com/mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list 2>/dev/null || true
          echo "--- resulting apt sources ---"
          cat /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || cat /etc/apt/sources.list

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: |
            pip install -r requirements-lock.txt
            playwright install --with-deps chromium

      - name: Run tests
        run: |
          SUITE="${{ inputs.suite }}"
          SUITE="${SUITE:-smoke}"
          if [ "$SUITE" = "all" ]; then
            pytest --alluredir=artifacts/allure-results
          else
            pytest -m "$SUITE" --alluredir=artifacts/allure-results
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: artifacts/allure-results
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: artifacts/screenshots
          retention-days: 14

      # Build the browsable Allure report for every run (including PRs) so a
      # failure's root cause is visible without needing to run allure serve
      # locally on the raw results. Reading gh-pages history here is safe on
      # PRs too — it's read-only and just seeds the trend graphs.
      - name: Checkout gh-pages history
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report with history
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: artifacts/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: ${{ env.KEEP_REPORTS }}

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      # Publishing to the public GitHub Pages site (and the runs.html summary
      # page) is manual-only — no point re-publishing on every PR push, and
      # in-progress feature-branch results should never overwrite the public
      # report.
      - name: Fix allure-history ownership
        # simple-elf/allure-report-action runs in a Docker container as root,
        # so it leaves allure-history/ root-owned on the runner. Later steps
        # run as the normal runner user and need to read/write it.
        if: always() && github.event_name == 'workflow_dispatch'
        run: sudo chown -R "$(id -u):$(id -g)" allure-history

      - name: Record run metadata
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/record_run_metadata.py \
            --meta-in gh-pages/runs-meta.json \
            --meta-out allure-history/runs-meta.json \
            --build "${{ github.run_number }}" \
            --trigger "${{ github.event_name }}" \
            --suite "${{ inputs.suite }}" \
            --keep "${{ env.KEEP_REPORTS }}"

      - name: Generate runs index page
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/generate_runs_index.py \
            "allure-history/${{ github.run_number }}/history/history-trend.json" \
            allure-history/runs-meta.json \
            allure-history/runs.html \
            --keep "${{ env.KEEP_REPORTS }}"

      - name: Publish report to GitHub Pages
        if: always() && github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
