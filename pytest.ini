[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers

markers =
    smoke: quick critical-path checks, run on every push
    regression: full regression suite
    api: API-layer tests
    ui: UI-layer tests (Playwright)
    positive: happy-path / positive scenarios
    negative: negative / error-path scenarios
